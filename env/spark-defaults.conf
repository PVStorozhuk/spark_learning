# Cluster and driver (the driver runs in the jupyter container)
spark.master                               spark://spark-master:7077
spark.driver.host                          jupyter
spark.driver.bindAddress                   0.0.0.0
spark.driver.memory                        4g

# Executors: 2 workers x (4 cores, 8g) -> 4 executors of 2 cores / 3g each
spark.executor.cores                       2
spark.executor.memory                      3g

# Event logs for the History Server
spark.eventLog.enabled                     true
spark.eventLog.dir                         file:/opt/spark/events
spark.history.fs.logDirectory              file:/opt/spark/events

# Iceberg: JDBC catalog in Postgres, warehouse on a shared volume
spark.sql.extensions                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lab                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lab.type                 jdbc
spark.sql.catalog.lab.uri                  jdbc:postgresql://iceberg-catalog-db:5432/iceberg
spark.sql.catalog.lab.jdbc.user            iceberg
spark.sql.catalog.lab.jdbc.password        iceberg
spark.sql.catalog.lab.jdbc.schema-version  V1
spark.sql.catalog.lab.warehouse            file:/opt/warehouse
spark.sql.defaultCatalog                   lab
